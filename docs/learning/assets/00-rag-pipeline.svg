<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
    <marker id="arrowLex" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#3a6ea5"/>
    </marker>
    <marker id="arrowVec" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#3d8b5f"/>
    </marker>
  </defs>

  <text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">双路 RAG 检索管线（查询 → 词法/向量并行 → RRF → 生成）</text>

  <!-- 查询 -->
  <rect x="330" y="48" width="240" height="54" rx="8" fill="#f2f2f2" stroke="#777"/>
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#333">查询 query</text>
  <text x="450" y="90" text-anchor="middle" font-size="12" fill="#666">「七天无理由退货从哪天起算」</text>

  <!-- 词法路 lane -->
  <text x="30" y="150" font-size="14" font-weight="bold" fill="#3a6ea5">词法路</text>
  <rect x="40" y="166" width="180" height="60" rx="8" fill="#eaf1f8" stroke="#3a6ea5"/>
  <text x="130" y="190" text-anchor="middle" font-size="13" fill="#2b4a6e">jieba 分词</text>
  <text x="130" y="208" text-anchor="middle" font-size="11" fill="#4a6a8e">cutForSearch + 清洗</text>

  <rect x="280" y="166" width="180" height="60" rx="8" fill="#eaf1f8" stroke="#3a6ea5"/>
  <text x="370" y="190" text-anchor="middle" font-size="13" fill="#2b4a6e">拼 tsquery OR 表达式</text>
  <text x="370" y="208" text-anchor="middle" font-size="11" fill="#4a6a8e">'七天 | 退货 | 起算'</text>

  <rect x="520" y="166" width="180" height="60" rx="8" fill="#eaf1f8" stroke="#3a6ea5"/>
  <text x="610" y="186" text-anchor="middle" font-size="13" fill="#2b4a6e">tsvector 索引匹配</text>
  <text x="610" y="204" text-anchor="middle" font-size="11" fill="#4a6a8e">GIN + ts_rank 排序</text>

  <rect x="740" y="172" width="130" height="48" rx="8" fill="#eaf1f8" stroke="#3a6ea5" stroke-dasharray="4 3"/>
  <text x="805" y="200" text-anchor="middle" font-size="13" fill="#2b4a6e">词法名次</text>

  <!-- 向量路 lane -->
  <text x="30" y="310" font-size="14" font-weight="bold" fill="#3d8b5f">向量路</text>
  <rect x="40" y="326" width="180" height="60" rx="8" fill="#eaf6ef" stroke="#3d8b5f"/>
  <text x="130" y="350" text-anchor="middle" font-size="13" fill="#2b5e3f">bge-m3 向量化</text>
  <text x="130" y="368" text-anchor="middle" font-size="11" fill="#4a7d5f">1024 维 embedding</text>

  <rect x="280" y="326" width="180" height="60" rx="8" fill="#eaf6ef" stroke="#3d8b5f"/>
  <text x="370" y="350" text-anchor="middle" font-size="13" fill="#2b5e3f">余弦距离 &lt;=&gt;</text>
  <text x="370" y="368" text-anchor="middle" font-size="11" fill="#4a7d5f">距离越小越相关</text>

  <rect x="520" y="326" width="180" height="60" rx="8" fill="#eaf6ef" stroke="#3d8b5f"/>
  <text x="610" y="346" text-anchor="middle" font-size="13" fill="#2b5e3f">HNSW 索引检索</text>
  <text x="610" y="364" text-anchor="middle" font-size="11" fill="#4a7d5f">ef_search=100</text>

  <rect x="740" y="332" width="130" height="48" rx="8" fill="#eaf6ef" stroke="#3d8b5f" stroke-dasharray="4 3"/>
  <text x="805" y="360" text-anchor="middle" font-size="13" fill="#2b5e3f">向量名次</text>

  <!-- RRF -->
  <rect x="350" y="438" width="200" height="62" rx="8" fill="#fdf3e7" stroke="#d98a2b"/>
  <text x="450" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a1b">RRF 融合（只看名次）</text>
  <text x="450" y="482" text-anchor="middle" font-size="12" fill="#8a5a1b">score += 1 / (60 + rank)</text>

  <!-- 生成 -->
  <rect x="350" y="540" width="200" height="54" rx="8" fill="#f3eefb" stroke="#7a5db0"/>
  <text x="450" y="562" text-anchor="middle" font-size="14" fill="#4a3570">LLM 生成回答</text>
  <text x="450" y="582" text-anchor="middle" font-size="11" fill="#6a5590">命中片段注入 + 引用编号标注</text>

  <!-- 箭头：查询 → 两路 -->
  <path d="M 390 102 L 130 160" stroke="#3a6ea5" stroke-width="1.6" fill="none" marker-end="url(#arrowLex)"/>
  <path d="M 510 102 L 130 320" stroke="#3d8b5f" stroke-width="1.6" fill="none" marker-end="url(#arrowVec)"/>

  <!-- 箭头：词法路横向 -->
  <path d="M 220 196 L 274 196" stroke="#3a6ea5" stroke-width="1.6" fill="none" marker-end="url(#arrowLex)"/>
  <path d="M 460 196 L 514 196" stroke="#3a6ea5" stroke-width="1.6" fill="none" marker-end="url(#arrowLex)"/>
  <path d="M 700 196 L 734 196" stroke="#3a6ea5" stroke-width="1.6" fill="none" marker-end="url(#arrowLex)"/>

  <!-- 箭头：向量路横向 -->
  <path d="M 220 356 L 274 356" stroke="#3d8b5f" stroke-width="1.6" fill="none" marker-end="url(#arrowVec)"/>
  <path d="M 460 356 L 514 356" stroke="#3d8b5f" stroke-width="1.6" fill="none" marker-end="url(#arrowVec)"/>
  <path d="M 700 356 L 734 356" stroke="#3d8b5f" stroke-width="1.6" fill="none" marker-end="url(#arrowVec)"/>

  <!-- 箭头：两路名次 → RRF -->
  <path d="M 805 220 C 805 320 520 430 456 432" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 805 380 C 805 320 520 470 456 470" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- 箭头：RRF → 生成 -->
  <path d="M 450 500 L 450 534" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
</svg>
